name: Android APK

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'TETO 线上 HTTPS 地址（例如 https://xxx.vercel.app）'
        required: true
        type: string

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor Android
        run: npm run android:sync
        env:
          CAPACITOR_SERVER_URL: ${{ github.event.inputs.server_url }}

      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: teto-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
